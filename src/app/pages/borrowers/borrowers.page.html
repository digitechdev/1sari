  <ion-toolbar>

  </ion-toolbar>
</ion-header> 
-->
<ion-header class="ion-no-border">
  <!-- Controls Bar -->
  <ion-toolbar class="controls-toolbar">
    <!-- Add padding to the grid itself if needed -->
    <ion-grid class="ion-no-padding ion-padding-horizontal">
      <!-- Use justify-content-between to push columns apart -->
      <ion-row class="ion-align-items-center ion-justify-content-between">
        <!-- Column 1: Search Bar (Takes available space, limited max width) -->
        <ion-col size="auto" size-md="6" size-lg="5" style="max-width: 400px;">
          <ion-searchbar
            class="controls-searchbar"
            (ionInput)="handleSearch($event)"
            [value]="searchTerm()"
            placeholder="Search borrowers..."
            debounce="300"
          ></ion-searchbar>
        </ion-col>

        <!-- Column 2: Action Buttons (Takes needed space, content aligned end) -->
        <ion-col size="auto" class="ion-text-end">
          <ion-button fill="clear" color="medium" (click)="refreshData()" class="ion-margin-end">
            <ion-icon slot="start" name="refresh-outline"></ion-icon>
            Refresh
          </ion-button>
          <ion-button color="success" (click)="addUser()">
            <ion-icon slot="start" name="add-outline"></ion-icon>
            Add New
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<!-- Added class for horizontal scrolling -->
<ion-content [scrollY]="true" class="datatable-content">
  <!-- Remove the condense header -->
  <!-- 
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">borrowers</ion-title>
    </ion-toolbar>
  </ion-header> 
  -->

  <!-- Loading/Error States -->
  @if (isLoading()) {
    <div class="state-message"><ion-spinner name="crescent"></ion-spinner></div>
  }
  @if (errorLoading()) {
    <div class="state-message"><ion-text color="danger">{{ errorLoading() }}</ion-text></div>
  }

  <!-- ngx-datatable implementation -->
  @if (!isLoading() && !errorLoading()) {
    <ngx-datatable
      class="material expandable"
      [rows]="displayableBorrowers()"
      [columns]="tableColumns"
      [columnMode]="ColumnMode.force"
      [headerHeight]="50"
      [footerHeight]="50"
      [rowHeight]="50"
      [scrollbarH]="true"
      [limit]="10"
    >
      <!-- Columns are now entirely driven by the [columns] binding -->
      <!-- Remove the explicit Actions column definition from here -->
      <!-- 
      <ngx-datatable-column
        name="Actions"
        prop="id" 
        [sortable]="false"
        [canAutoResize]="false"
        [draggable]="false"
        [resizeable]="false"
        [width]="120"
      >
        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
          ...
        </ng-template>
      </ngx-datatable-column> 
      -->
    </ngx-datatable>

    <!-- Define the template for the Actions cell outside the table -->
    <ng-template #actionsTemplate let-row="row" let-value="value">
      <!-- Add some spacing using utility classes or inline style -->
      <ion-button fill="clear" size="small" (click)="viewBorrower(row)" title="View" class="action-button">
        <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" (click)="editBorrower(row)" title="Edit" class="action-button">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" color="danger" (click)="deleteBorrower(row)" title="Delete" class="action-button">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ng-template>

    <ng-template #editTmpl let-row="row" let-value="value">
      {{ value  }}
    </ng-template>

  }
</ion-content>
