<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Payment History</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/payments/new">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Record Payment
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  
  <ion-toolbar>
    <ion-segment [value]="'history'" (ionChange)="navigateToPaymentSection($event)">
      <ion-segment-button value="history">
        <ion-label>History</ion-label>
      </ion-segment-button>
      <ion-segment-button value="upcoming">
        <ion-label>Upcoming</ion-label>
      </ion-segment-button>
      <ion-segment-button value="missed">
        <ion-label>Missed</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" class="datatable-content">
  <ion-grid fixed>
    <ion-row>
      <ion-col size="12">
        <ion-card class="payments-card-list">
          <ion-card-header class="payments-card-header">
            <ion-card-title>
              <ion-grid class="ion-no-padding ion-padding-horizontal">
                <ion-row
                  class="ion-align-items-center ion-justify-content-between"
                >
                  <ion-col
                    size="auto"
                    size-md="6"
                    size-lg="5"
                    style="max-width: 400px"
                  >
                    <ion-searchbar
                      class="controls-searchbar"
                      (ionInput)="handleSearch($event)"
                      [value]="searchTerm()"
                      placeholder="Search payments (ID, Borrower, Date...)"
                      debounce="300"
                    ></ion-searchbar>
                  </ion-col>

                  <ion-col size="auto" class="ion-text-end">
                    <ion-button
                      fill="clear"
                      color="medium"
                      (click)="refreshData()"
                      class="ion-margin-end"
                    >
                      <ion-icon slot="start" name="refresh-outline"></ion-icon>
                      Refresh
                    </ion-button>
                    <ion-button color="primary" routerLink="/payments/new">
                      <ion-icon slot="start" name="add-outline"></ion-icon>
                      Record New Payment
                    </ion-button>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-card-title>
          </ion-card-header>

          <ion-card-content>
            @if (isLoading()) {
              <div class="state-message"><ion-spinner name="crescent"></ion-spinner> Loading Payments...</div>
            }
            @if (errorLoading()) {
              <div class="state-message"><ion-text color="danger">{{ errorLoading() }}</ion-text></div>
            }

            @if (!isLoading() && !errorLoading()) {
              <ngx-datatable
                class="material expandable payments-datatable"
                [rows]="displayablePayments()" 
                [columns]="tableColumns"
                [columnMode]="ColumnMode.force"
                [headerHeight]="50"
                [footerHeight]="50"
                [rowHeight]="50"
                [scrollbarH]="true"
                [limit]="10" 
              >
              </ngx-datatable>
              <ng-template #paymentActionsTemplate let-row="row" let-value="value">
                <div class="action-buttons-container">
                  <ion-button
                    fill="solid"
                    size="small"
                    (click)="viewPayment(row)"
                    title="View"
                    class="action-button"
                  >
                    <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
                  </ion-button>
                  <ion-button
                    fill="solid"
                    color="medium"
                    size="small"
                    (click)="editPayment(row)"
                    title="Edit"
                    class="action-button"
                  >
                    <ion-icon slot="icon-only" name="create-outline"></ion-icon>
                  </ion-button>
                  <ion-button
                    fill="solid"
                    size="small"
                    color="danger"
                    (click)="deletePayment(row)"
                    title="Delete"
                    class="action-button"
                  >
                    <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                  </ion-button>
                </div>
              </ng-template>
            }
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
