<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Missed Payments</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/payments/new">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Record Payment
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  
  <ion-toolbar>
    <ion-segment [value]="'missed'" (ionChange)="navigateToPaymentSection($event)">
      <ion-segment-button value="history">
        <ion-label>History</ion-label>
      </ion-segment-button>
      <ion-segment-button value="upcoming">
        <ion-label>Upcoming</ion-label>
      </ion-segment-button>
      <ion-segment-button value="missed">
        <ion-label>Missed</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Missed Payments</ion-card-title>
      <ion-card-subtitle>Overdue payments requiring attention</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>This page will display all missed and overdue payments. The content is under development.</p>
      <ion-button routerLink="/payments/new" expand="block" color="primary">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Record New Payment
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
