<app-header></app-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-lg="8">
        <!-- Main Content Area -->
        <ion-row>
          <ion-col size="12" size-md="6">
            <app-income-widget></app-income-widget>
          </ion-col>
          <ion-col size="12" size-md="6">
            <app-expenses-widget></app-expenses-widget>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="12">
            <app-transactions-widget></app-transactions-widget>
          </ion-col>
        </ion-row>
      </ion-col>
      <ion-col size="12" size-lg="4">
        <!-- Sidebar Area -->
        <app-balance-widget></app-balance-widget>
        <app-my-pocket-widget></app-my-pocket-widget>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
