<ion-header>
  <ion-toolbar color="secondary">
    <!-- Logo and Title -->
    <ion-buttons slot="start">
      <!-- Placeholder for Logo -->
      <ion-title style="padding-left: 10px;">Walletit</ion-title>
    </ion-buttons>

    <!-- Navigation Links -->
    <ion-buttons slot="start" style="margin-left: 20px;">
      <ion-button fill="clear" color="light">Dashboard</ion-button>
      <ion-button fill="clear" color="medium">Wallet</ion-button>
      <ion-button fill="clear" color="medium">Analytics</ion-button>
      <ion-button fill="clear" color="medium">Transaction</ion-button>
    </ion-buttons>

    <!-- Search, Notifications, Profile -->
    <ion-buttons slot="end">
      <ion-searchbar placeholder="Search" style="width: 250px; --background: var(--ion-color-secondary-shade);"></ion-searchbar>
      <ion-button fill="clear" color="light">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear">
        <ion-avatar slot="start" style="width: 32px; height: 32px; margin-right: 8px;">
          <!-- Placeholder Avatar -->
          <ion-icon name="person-circle-outline" style="font-size: 32px; color: var(--ion-color-light);"></ion-icon>
        </ion-avatar>
        <ion-label color="light">
          <h3 style="margin: 0; font-size: 0.9em;">Asal Design</h3>
          <p style="margin: 0; font-size: 0.7em; color: var(--ion-color-medium);">asaldesign&#64;gmail.com</p>
        </ion-label>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>
